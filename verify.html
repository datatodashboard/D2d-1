<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Credential Verification • Data2Dashboard (D2D)</title>
  <link rel="icon" href="./icon-512.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #070b18;
      --bg-navy: #0b1226;
      --surface-navy: rgba(15, 23, 42, 0.74);
      --surface-cream: rgba(15, 23, 42, 0.78);
      --surface-cream-elevated: rgba(22, 33, 62, 0.86);
      --ink-on-navy: #f8fafc;
      --ink-muted-on-navy: #94a3b8;
      --ink-on-cream: #f8fafc;
      --accent-blue: #3b82f6;
      --accent-indigo: #6366f1;
      --accent-violet: #8b5cf6;
      --accent-cyan: #22d3ee;
      --gradient-primary: linear-gradient(135deg, #3b82f6 0%, #6366f1 52%, #8b5cf6 100%);
      --gradient-primary-hover: linear-gradient(135deg, #2563eb 0%, #4f46e5 52%, #7c3aed 100%);
      --teal-primary: #14b8a6;
      --teal-hover: #0d9488;
      --teal-accent: #22d3ee;
      --gold-accent: #67e8f9;
      --border-navy: rgba(255, 255, 255, 0.08);
      --border-cream: rgba(255, 255, 255, 0.1);
      --focus-ring: 0 0 0 3px rgba(56, 189, 248, 0.42);

      --bg: var(--bg-deep);
      --surface: var(--surface-navy);
      --ink: var(--ink-on-navy);
      --muted: var(--ink-muted-on-navy);
      --primary: var(--accent-indigo);
      --gold: var(--gold-accent);
      --line: var(--border-navy);
      --good: #14b8a6;
      --bad: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { overflow-x: hidden; width: 100%; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-deep);
      background-image:
        radial-gradient(circle at 16% 12%, rgba(56, 189, 248, 0.14) 0%, transparent 40%),
        radial-gradient(circle at 84% 16%, rgba(139, 92, 246, 0.13) 0%, transparent 42%),
        radial-gradient(circle at 88% 88%, rgba(249, 115, 22, 0.075) 0%, transparent 42%),
        linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-navy) 54%, #060a16 100%);
      background-attachment: fixed;
      color: var(--ink);
      line-height: 1.5;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    .header {
      background: rgba(11, 18, 38, 0.78);
      border-bottom: 1px solid var(--line);
      padding: max(12px, env(safe-area-inset-top, 12px)) 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .brand-wrap {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      text-decoration: none;
      color: inherit;
    }
    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid rgba(56, 189, 248, 0.35);
      flex-shrink: 0;
    }
    .brand-name {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: #f8fafc;
    }
    .brand-sub {
      font-size: 12px;
      color: var(--teal-accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
    }
    .main-wrap {
      max-width: 640px;
      width: 100%;
      margin: 28px auto;
      padding: 0 16px;
      flex: 1;
    }
    .card {
      background: linear-gradient(165deg, var(--surface-cream-elevated) 0%, var(--surface-cream) 100%);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--ink);
      border: 1px solid var(--border-cream);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(2, 6, 23, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      padding: 28px;
    }
    h1 {
      font-size: clamp(1.35rem, 5vw, 1.5rem);
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: -0.4px;
      color: #f8fafc;
    }
    .lead {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 22px;
    }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }
    input[type="text"] {
      flex: 1;
      min-width: 0;
      min-height: 46px;
      padding: 12px 16px;
      background: rgba(7, 11, 24, 0.88);
      color: #f8fafc;
      border: 1.5px solid rgba(56, 189, 248, 0.28);
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.16s ease;
    }
    input[type="text"]::placeholder {
      color: #64748b;
    }
    input[type="text"]:focus,
    input[type="text"]:focus-visible {
      border-color: var(--accent-cyan);
      box-shadow: var(--focus-ring);
      outline: 2px solid var(--accent-cyan);
      outline-offset: 2px;
    }
    button.btn-primary {
      min-height: 46px;
      min-width: 46px;
      padding: 12px 22px;
      background: var(--gradient-primary);
      color: #fff;
      border: 1px solid rgba(139, 92, 246, 0.48);
      border-radius: 12px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 8px 22px rgba(99, 102, 241, 0.34);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    button.btn-primary:hover {
      background: var(--gradient-primary-hover);
      border-color: #22d3ee;
      transform: translateY(-1px);
    }
    button.btn-primary:focus-visible {
      outline: 2px solid var(--accent-cyan);
      outline-offset: 2px;
      box-shadow: var(--focus-ring);
    }
    .cert-result {
      border-top: 1px solid var(--border-cream);
      padding-top: 24px;
      margin-top: 10px;
      overflow-x: auto;
      overscroll-behavior: contain;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 18px;
    }
    .status-valid {
      background: rgba(20, 184, 166, 0.16);
      color: #5eead4;
      border: 1px solid rgba(45, 212, 191, 0.42);
    }
    .status-invalid {
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      border: 1px solid rgba(248, 113, 113, 0.42);
    }
    .field-row {
      display: flex;
      flex-direction: column;
      margin-bottom: 14px;
    }
    .field-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 2px;
    }
    .field-val {
      font-size: 16px;
      font-weight: 700;
      color: #f8fafc;
      overflow-wrap: anywhere;
    }
    .field-val.gold {
      color: #67e8f9;
      font-size: 20px;
      font-weight: 800;
    }
    .footer {
      text-align: center;
      padding: 20px 16px max(24px, calc(16px + env(safe-area-inset-bottom, 0px)));
      font-size: 12.5px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      background: rgba(11, 18, 38, 0.82);
    }
    @media (max-width: 480px) {
      .search-box {
        flex-direction: column;
      }
      button.btn-primary {
        width: 100%;
      }
      .card {
        padding: 20px 16px;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="header">
    <a href="./index.html" class="brand-wrap">
      <img src="./icon-512.png" alt="D2D Logo" class="brand-logo">
      <div>
        <div class="brand-name">Crack SQL</div>
        <div class="brand-sub">Data2Dashboard (D2D)</div>
      </div>
    </a>
    <a href="./index.html" style="font-size: 13.5px; font-weight: 700; color: var(--teal-accent); text-decoration: none; min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; padding: 8px 10px; touch-action: manipulation;">← Back to App</a>
  </header>

  <main class="main-wrap">
    <div class="card">
      <h1>Credential Verification</h1>
      <p class="lead">Verify the authenticity of a scenario-based certification issued by Data2Dashboard (D2D).</p>

      <form class="search-box" id="verifyForm" onsubmit="event.preventDefault(); verifyEnteredId();">
        <input type="text" id="credentialInput" placeholder="Enter Credential ID (e.g. D2D-CSQL-BEG-2026-XXXXXX)" autocomplete="off" required>
        <button type="submit" class="btn-primary" id="verifyBtn">Verify</button>
      </form>

      <div id="resultArea" class="cert-result" style="display: none;"></div>
    </div>
  </main>

  <footer class="footer">
    <div>Data2Dashboard (D2D) • Crack SQL Learning Platform</div>
    <div style="margin-top: 4px;">Public Credential Verification Service</div>
  </footer>

  <script>
    const SUPABASE_URL = 'https://qklnaqfspvmnlequqagf.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_dthVX8zmvd1HvWaYWBaojA_2YbvHWe1';
    let client = null;

    try {
      if (window.supabase) {
        client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) {
      console.warn('Supabase init warning:', e);
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function formatDate(dateStr) {
      try {
        const d = dateStr ? new Date(dateStr) : new Date();
        return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' });
      } catch (_) {
        return dateStr || 'Verified';
      }
    }

    async function verifyId(credId) {
      const cleanId = String(credId || '').trim();
      const resEl = document.getElementById('resultArea');
      const inputEl = document.getElementById('credentialInput');
      inputEl.value = cleanId;
      if (!cleanId) return;

      resEl.style.display = 'block';
      resEl.innerHTML = '<div style="color:var(--muted);text-align:center;padding:20px;">Verifying credential with Data2Dashboard registry…</div>';

      try {
        let certData = null;

        // 1. Try public RPC verify_certificate
        if (client) {
          try {
            const { data, error } = await client.rpc('verify_certificate', { p_credential_id: cleanId });
            if (!error && data && data.valid) {
              certData = data;
            } else if (data && data.valid === false) {
              showNotFound();
              return;
            }
          } catch (_) {}

          // 2. Direct table fallback if RPC unavailable
          if (!certData) {
            const { data: row } = await client
              .from('certificates')
              .select('credential_id, recipient_name, domain, level, course_title, description, completed_at')
              .ilike('credential_id', cleanId)
              .maybeSingle();
            if (row) {
              certData = {
                valid: true,
                ...row,
                issuer: 'Data2Dashboard (D2D)',
                organization: 'Crack SQL Learning Platform'
              };
            }
          }
        }

        // 3. Check local storage cache as offline fallback
        if (!certData) {
          try {
            for (let i = 0; i < localStorage.length; i++) {
              const k = localStorage.key(i);
              if (k && k.startsWith('cracksql_user_certificates_v1')) {
                const list = JSON.parse(localStorage.getItem(k) || '[]');
                const found = list.find(c => c.credential_id && c.credential_id.toLowerCase() === cleanId.toLowerCase());
                if (found) {
                  certData = { valid: true, ...found, issuer: 'Data2Dashboard (D2D)', organization: 'Crack SQL Learning Platform' };
                  break;
                }
              }
            }
          } catch (_) {}
        }

        if (certData && certData.valid) {
          resEl.innerHTML = `
            <div class="status-badge status-valid">✓ Authentic &amp; Verified Credential</div>
            <div class="field-row">
              <div class="field-label">Recipient Name</div>
              <div class="field-val gold">${escapeHtml(certData.recipient_name)}</div>
            </div>
            <div class="field-row">
              <div class="field-label">Course Title</div>
              <div class="field-val">${escapeHtml(certData.course_title)}</div>
            </div>
            <div class="field-row">
              <div class="field-label">Domain &amp; Level</div>
              <div class="field-val">${escapeHtml(certData.domain)} — ${escapeHtml(certData.level)} Level (20 Scenarios)</div>
            </div>
            <div class="field-row">
              <div class="field-label">Date Awarded</div>
              <div class="field-val">${formatDate(certData.completed_at)}</div>
            </div>
            <div class="field-row">
              <div class="field-label">Credential ID</div>
              <div class="field-val" style="font-family:monospace;font-size:14px;color:var(--primary);">${escapeHtml(certData.credential_id)}</div>
            </div>
            <div class="field-row">
              <div class="field-label">Issuing Organization</div>
              <div class="field-val" style="font-size:14px;">Data2Dashboard (D2D) • Crack SQL Learning Platform</div>
            </div>
          `;
        } else {
          showNotFound();
        }
      } catch (err) {
        showNotFound();
      }
    }

    function showNotFound() {
      const resEl = document.getElementById('resultArea');
      resEl.style.display = 'block';
      resEl.innerHTML = `
        <div class="status-badge status-invalid">⚠ Certificate not found</div>
        <p style="font-size:14px;color:var(--ink);margin-bottom:8px;">The credential identifier entered does not match any certificate in the Data2Dashboard verified database.</p>
        <p style="font-size:12.5px;color:var(--muted);">Please check the spelling of the ID (e.g. <code>D2D-CSQL-BEG-2026-XXXXXX</code>) and try again.</p>
      `;
    }

    function verifyEnteredId() {
      const val = document.getElementById('credentialInput').value;
      verifyId(val);
    }

    // Auto-check on page load from URL parameters: ?id=... or ?verify=...
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const credId = params.get('id') || params.get('verify');
      if (credId) {
        verifyId(credId);
      }
    });
  </script>
</body>
</html>
